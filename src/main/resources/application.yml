spring:
  application:
    name: mySchedule

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=MY_SCHEDULE;encrypt=true;trustServerCertificate=true
    username: sa
    password: StrongPassword123!
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

    show-sql: true

    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect

jwt:
  secret: a-string-secret-at-least-256-bits-long